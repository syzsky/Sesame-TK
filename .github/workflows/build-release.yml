name: Build & Release APK

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - ".github/**"
      - "**.md"
      - ".upstream-sha"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew assembleRelease --no-daemon -Pversion=v0.9.9

      - name: Show APK outputs
        run: find app/build/outputs/apk/release -name '*.apk' -exec ls -lh {} \;

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.9.9-b${GITHUB_RUN_NUMBER}" \
            --title "Sesame-TK v0.9.9 (build ${GITHUB_RUN_NUMBER})" \
            --generate-notes \
            app/build/outputs/apk/release/*.apk
